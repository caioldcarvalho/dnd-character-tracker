name: Release

# Build the desktop app and publish installers when a version tag is pushed.
# Tag with `git tag v0.1.0 && git push origin v0.1.0` to trigger.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'rpgman ${{ github.ref_name }}'
          releaseBody: |
            Desktop builds of rpgman — a D&D 2024 character tracker.

            **Windows users:** download the `.msi` (or `_x64-setup.exe`) installer below.
            Windows SmartScreen may warn that the publisher is unknown (the app is
            unsigned). Click **More info → Run anyway** to install. See the README
            for details.
          releaseDraft: false
          prerelease: false
          projectPath: '.'
          args: ${{ matrix.args }}
