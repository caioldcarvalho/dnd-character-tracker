[package]
name = "rpgman"
version = "0.1.0"
edition = "2021"
description = "rpgman — a D&D 2024 character manager"
authors = ["caio"]
default-run = "rpgman"

[lib]
name = "rpgman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
rpgman-engine = { path = "../crates/engine" }

[features]
# Enable Tauri's custom-protocol in release builds.
custom-protocol = ["tauri/custom-protocol"]
