[package]
name = "rpgman-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "D&D 2024 character rules engine: every stat is a traceable list of contributions."

[lib]
name = "rpgman_engine"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { version = "12", optional = true }

[features]
# Frontend type generation is opt-in so it never ships in release builds.
ts = ["dep:ts-rs"]
