[package]
name = "rpgman-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpgman-engine = { path = "../engine" }
serde_json.workspace = true
# Pinned to match the Arch `wasm-bindgen` CLI (0.2.122) so the crate's glue and
# the post-processing CLI agree even on this non-rustup, system-rust setup.
wasm-bindgen = "=0.2.122"
console_error_panic_hook = "0.1"
